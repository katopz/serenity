[package]
name = "wasm_rest_api"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wasm_rest_api"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serenity = { path = "../../", default-features = false, features = ["model", "http", "builder", "utils"] }
serde_json = "1.0.108"

# Native platform dependencies (for main.rs local testing)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.34.0", features = ["macros", "rt-multi-thread"] }
serenity = { path = "../../", default-features = false, features = ["model", "http", "builder", "utils", "native_tls_backend"] }

# WASM platform dependencies (for lib.rs Workers deployment)
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.4.2"
serenity = { path = "../../", default-features = false, features = ["model", "http", "builder", "utils", "wasm", "reqwest-wasm"] }
